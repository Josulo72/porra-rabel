name: Auto Update Match Results

on:
  schedule:
    # Viernes a lunes: cada 5 min en horario de partidos (10:00-23:59 UTC)
    - cron: '*/5 10-23 * * 5,6,0,1'
    # Martes a jueves: cada 30 min por si hay partidos puestos a mano (Copa, etc.)
    - cron: '0,30 12-22 * * 2,3,4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar actualizacion aunque el partido no haya empezado'
        required: false
        default: 'false'

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and update match results
        run: |
          node --experimental-fetch - <<'SCRIPT'

          const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwIo68AUaC7Sd9eXKWGUWcCP6Be24j-9TmkHNEVKSmfOVIT5fQen3Kq5mqWlwLSyXq86w/exec';
          const ESPN_LEAGUES = ['esp.1', 'esp.2', 'esp.copa_del_rey'];
          const SOFASCORE_TEAM_IDS = {
            'arenteiro': 263555,
            'cd arenteiro': 263555,
            'ponferradina': 6195,
            'sd ponferradina': 6195,
          };

          const SOFA_HEADERS = {
            'Accept': 'application/json',
            'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36',
            'Accept-Language': 'es-ES,es;q=0.9',
            'Referer': 'https://www.sofascore.com/',
            'Origin': 'https://www.sofascore.com',
          };

          function normalize(s) {
            return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
              .replace(/\bfc\b|\bcf\b|\bsd\b|\bcd\b|\bud\b|\bad\b|\breal\b|\batletico\b|\bathletic\b|\bdeportivo\b/g,'')
              .replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
          }

          function levenshtein(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i?j?0:j:i));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[m][n];}

          function teamsMatch(n1,n2){const a=normalize(n1),b=normalize(n2);if(!a||!b)return false;if(a===b||a.includes(b)||b.includes(a))return true;if(a.length>3&&b.length>3&&levenshtein(a,b)<=3)return true;return false;}

          // Extrae goles y tarjetas del scoreboard de ESPN
          function extractEspnEvents(comp, hC) {
            const homeId = String((hC.team && hC.team.id) || hC.id || '');
            const out = [];
            for (const d of (comp.details || [])) {
              const t = ((d.type && d.type.text) || '').toLowerCase();
              let type = null;
              if (d.scoringPlay || t.includes('goal')) type = 'goal';
              else if (t.includes('yellow')) type = 'yellow';
              else if (t.includes('red')) type = 'red';
              if (!type) continue;
              out.push({
                minute: ((d.clock && d.clock.displayValue) || '').replace(/'/g, ''),
                type,
                player: (d.athletesInvolved && d.athletesInvolved[0] && d.athletesInvolved[0].displayName) || '',
                side: String((d.team && d.team.id) || '') === homeId ? 'home' : 'away',
              });
            }
            return out;
          }

          async function getFromESPN(homeTeam,awayTeam,dateStr){
            for(const league of ESPN_LEAGUES){
              try{
                const res=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/scoreboard?dates=${dateStr}`,{signal:AbortSignal.timeout(8000)});
                if(!res.ok)continue;
                const data=await res.json();
                for(const event of (data.events||[])){
                  const comp=event.competitions?.[0];
                  const hC=comp?.competitors?.find(t=>t.homeAway==='home');
                  const aC=comp?.competitors?.find(t=>t.homeAway==='away');
                  if(!hC||!aC)continue;
                  const eH=hC.team?.displayName||hC.team?.name||'';
                  const eA=aC.team?.displayName||aC.team?.name||'';
                  if(teamsMatch(eH,homeTeam)&&teamsMatch(eA,awayTeam)){
                    const h=parseInt(hC.score,10),a=parseInt(aC.score,10);
                    const status=event.status?.type?.description||'';
                    const stType=event.status?.type?.state||'';
                    const completed=event.status?.type?.completed===true;
                    const clock=(event.status?.displayClock||'').replace(/'/g,'');
                    const events=extractEspnEvents(comp,hC);
                    const espnLogo=(c)=>c.team?.logo||(c.team?.id?`https://a.espncdn.com/i/teamlogos/soccer/500/${c.team.id}.png`:'');
                    console.log(`  ESPN ${league}: ${eH} ${h}-${a} ${eA} [${status}] ${clock} | ${events.length} eventos`);
                    return{home:isNaN(h)?null:h,away:isNaN(a)?null:a,status,stType,completed,minute:stType==='in'?clock:'',events,homeLogo:espnLogo(hC),awayLogo:espnLogo(aC),source:'espn'};
                  }
                }
              }catch(e){console.log(`  ESPN ${league}: ${e.message}`);}
            }
            return null;
          }

          // Goles y tarjetas de Sofascore (endpoint incidents)
          async function sofaIncidents(eventId){
            try{
              const res=await fetch(`https://api.sofascore.com/api/v1/event/${eventId}/incidents`,{headers:SOFA_HEADERS,signal:AbortSignal.timeout(10000)});
              if(!res.ok)return[];
              const data=await res.json();
              const out=[];
              for(const inc of (data.incidents||[])){
                if(inc.incidentType==='goal'){
                  out.push({minute:String(inc.time??''),type:'goal',player:(inc.player&&(inc.player.shortName||inc.player.name))||'',side:inc.isHome?'home':'away'});
                }else if(inc.incidentType==='card'){
                  const cls=(inc.incidentClass||'').toLowerCase();
                  out.push({minute:String(inc.time??''),type:(cls.includes('red')||cls==='yellowred')?'red':'yellow',player:(inc.player&&(inc.player.shortName||inc.player.name))||'',side:inc.isHome?'home':'away'});
                }
              }
              return out.reverse();
            }catch(e){console.log(`  Sofascore incidents: ${e.message}`);return[];}
          }

          async function getFromSofascore(homeTeam,awayTeam,dateStr){
            const homeId=SOFASCORE_TEAM_IDS[normalize(homeTeam)];
            const awayId=SOFASCORE_TEAM_IDS[normalize(awayTeam)];
            const teamId=homeId||awayId;
            if(!teamId)return null;
            console.log(`  Sofascore: buscando team ID ${teamId}...`);
            const targetDate=dateStr.slice(0,4)+'-'+dateStr.slice(4,6)+'-'+dateStr.slice(6,8);
            for(const ep of ['next/0','last/0']){
              try{
                const res=await fetch(`https://api.sofascore.com/api/v1/team/${teamId}/events/${ep}`,{headers:SOFA_HEADERS,signal:AbortSignal.timeout(10000)});
                if(!res.ok){console.log(`  Sofascore ${ep}: HTTP ${res.status}`);continue;}
                const data=await res.json();
                for(const evt of (data.events||[])){
                  const evtDate=new Date(evt.startTimestamp*1000).toISOString().slice(0,10);
                  if(evtDate!==targetDate)continue;
                  const eH=evt.homeTeam?.name||'';
                  const eA=evt.awayTeam?.name||'';
                  if(!teamsMatch(eH,homeTeam)||!teamsMatch(eA,awayTeam))continue;
                  const h=evt.homeScore?.current;
                  const a=evt.awayScore?.current;
                  const status=evt.status?.description||'';
                  const stTypeRaw=evt.status?.type||'';
                  const stType=stTypeRaw==='inprogress'?'in':(stTypeRaw==='finished'?'post':'pre');
                  const completed=stTypeRaw==='finished';
                  // Minuto aproximado a partir del inicio del periodo actual
                  let minute='';
                  if(stTypeRaw==='inprogress'&&evt.time&&evt.time.currentPeriodStartTimestamp){
                    let m=Math.floor((Date.now()/1000-evt.time.currentPeriodStartTimestamp)/60)+1;
                    if(/2nd|segunda/i.test(status))m+=45;
                    minute=String(Math.max(1,Math.min(m,120)));
                  }
                  const events=await sofaIncidents(evt.id);
                  const sofaLogo=(t)=>(t&&t.id)?`https://api.sofascore.com/api/v1/team/${t.id}/image`:'';
                  console.log(`  Sofascore: ${eH} ${h}-${a} ${eA} [${status}] min ${minute} | ${events.length} eventos`);
                  return{home:(h===null||h===undefined)?null:parseInt(h),away:(a===null||a===undefined)?null:parseInt(a),status,stType,completed,minute,events,homeLogo:sofaLogo(evt.homeTeam),awayLogo:sofaLogo(evt.awayTeam),source:'sofascore'};
                }
              }catch(e){console.log(`  Sofascore ${ep}: ${e.message}`);}
            }
            return null;
          }

          async function getResult(match){
            const kickoffDate=new Date(match.kickoff);
            const dateStr=kickoffDate.toISOString().slice(0,10).replace(/-/g,'');
            console.log(`  Buscando: ${match.homeTeam} vs ${match.awayTeam}`);
            const espnResult=await getFromESPN(match.homeTeam,match.awayTeam,dateStr);
            if(espnResult)return espnResult;
            const sofaResult=await getFromSofascore(match.homeTeam,match.awayTeam,dateStr);
            if(sofaResult)return sofaResult;
            return null;
          }

          async function main(){
            console.log('=== Actualizacion automatica de resultados ===');
            console.log('Hora UTC:',new Date().toISOString());
            const stateRes=await fetch(APPS_SCRIPT_URL+'?action=getState');
            const stateData=await stateRes.json();
            if(!stateData.ok||!stateData.state){console.log('ERROR:',JSON.stringify(stateData));process.exit(1);}
            const state=stateData.state;
            const matches=state.matches||[];
            console.log('Partidos:',matches.length);
            let updated=false;
            const now=new Date();
            for(const match of matches){
              console.log(`\n--- ${match.id}: ${match.homeTeam} vs ${match.awayTeam} ---`);
              // Partido ya cerrado por el propio workflow: no volver a tocarlo
              if(match.live&&match.live.phase==='post'&&match.result?.home!==null&&match.result?.away!==null){
                console.log(`  Ya finalizado: ${match.result.home}-${match.result.away}`);continue;
              }
              if(!match.kickoff){console.log('  Sin kickoff');continue;}
              const kickoff=new Date(match.kickoff);
              const mins=(now-kickoff)/60000;
              if(mins<-10){console.log(`  Empieza en ${Math.round(-mins)} min`);continue;}
              if(mins>480){console.log(`  Demasiado antiguo (${Math.round(mins)} min)`);continue;}
              console.log(`  Empezado hace ${Math.round(mins)} min`);
              const result=await getResult(match);
              if(!result){console.log('  Sin datos de ESPN ni Sofascore.');continue;}

              const isFinished=result.completed||/ended|final|full time|\bft\b|terminado|finished/i.test(result.status||'')||(result.stType==='post');
              const hasScore=result.home!==null&&result.away!==null;

              if(hasScore){
                match.result={home:result.home,away:result.away};
              }
              if(!match.homeLogo&&result.homeLogo)match.homeLogo=result.homeLogo;
              if(!match.awayLogo&&result.awayLogo)match.awayLogo=result.awayLogo;
              match.source=result.source;
              match.live={
                minute:isFinished?'':(result.minute||''),
                status:result.status||'',
                phase:isFinished?'post':(result.stType==='in'?'in':'pre'),
              };
              if(Array.isArray(result.events)&&result.events.length){
                match.events=result.events;
              }
              match.lastUpdated=new Date().toISOString();
              updated=true;
              if(isFinished&&hasScore){
                console.log(`  FINAL: ${result.home}-${result.away} [${result.status}] via ${result.source}`);
              }else{
                console.log(`  EN VIVO: ${result.home}-${result.away} min ${result.minute} [${result.status}] via ${result.source}`);
              }
            }
            if(updated){
              console.log('\nGuardando en Apps Script...');
              const saveRes=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'setState',state})});
              const saveData=await saveRes.json().catch(()=>({}));
              console.log('Resultado guardado:',JSON.stringify(saveData));
            }else{
              console.log('\nSin actualizaciones.');
            }
          }

          main().catch(e=>{console.error('Error fatal:',e.message||e);process.exit(1);});
          SCRIPT
