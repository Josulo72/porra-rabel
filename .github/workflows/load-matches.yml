name: Auto Cargar Partidos

on:
  schedule:
    # Noche del lunes (01:45 hora espanola): carga la siguiente jornada
    # en cuanto termina el ultimo partido de la anterior
    - cron: '45 23 * * 1'
    # Reintentos martes, miercoles y jueves a las 07:00 hora espanola
    - cron: '0 5 * * 2,3,4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar recarga aunque los partidos actuales no hayan terminado'
        required: false
        default: 'false'

jobs:
  load-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar y cargar proximos partidos
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          node --experimental-fetch - <<'SCRIPT'

          const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwIo68AUaC7Sd9eXKWGUWcCP6Be24j-9TmkHNEVKSmfOVIT5fQen3Kq5mqWlwLSyXq86w/exec';
          const FORCE = process.env.FORCE === 'true';

          // Dias validos para la porra (hora de Madrid): viernes, sabado, domingo, lunes
          const VALID_DAYS = ['Fri', 'Sat', 'Sun', 'Mon'];

          // Configuracion de los 3 equipos fijos de la porra
          const TEAMS = [
            { slot: 0, name: 'Real Madrid',     provider: 'espn',      espnTeamId: '86' },
            { slot: 1, name: 'FC Barcelona',    provider: 'espn',      espnTeamId: '83' },
            { slot: 2, name: 'SD Ponferradina', provider: 'sofascore', sofaTeamId: 6195 },
          ];

          const SOFA_HEADERS = {
            'Accept': 'application/json',
            'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36',
            'Accept-Language': 'es-ES,es;q=0.9',
            'Referer': 'https://www.sofascore.com/',
            'Origin': 'https://www.sofascore.com',
          };

          function madridWeekday(date) {
            return new Intl.DateTimeFormat('en-US', { timeZone: 'Europe/Madrid', weekday: 'short' }).format(date);
          }

          function madridLocalISO(date) {
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Europe/Madrid', year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
            }).formatToParts(date).reduce((a, p) => (a[p.type] = p.value, a), {});
            return `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}`;
          }

          function normalize(s) {
            return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .replace(/\bfc\b|\bcf\b|\bsd\b|\bcd\b|\bud\b|\bad\b|\breal\b/g, '')
              .replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
          }

          // Un hueco esta "gastado" si no tiene partido o si su kickoff paso hace mas
          // de 4.5h (mas que la ventana de 250 min de partido en vivo). Asi un partido
          // del lunes a las 21:00 ya cuenta como terminado en la carga de la 01:45.
          function slotStale(m) {
            if (!m || !m.homeTeam || !m.awayTeam || !m.kickoff) return true;
            const ko = new Date(m.kickoff);
            if (isNaN(ko.getTime())) return true;
            return (Date.now() - ko.getTime()) > 4.5 * 3600 * 1000;
          }

          async function nextEspnMatch(teamId) {
            // fixture=true devuelve los partidos POR JUGAR; sin el, ESPN solo da los jugados
            const base = `https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/teams/${teamId}/schedule`;
            let events = [];
            for (const url of [base + '?fixture=true', base]) {
              try {
                const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
                if (!res.ok) continue;
                const data = await res.json();
                events = events.concat(data.events || []);
              } catch (e) { console.log('  ESPN:', e.message); }
            }
            if (!events.length) throw new Error('ESPN sin eventos');
            const now = Date.now();
            const future = events
              .filter(ev => new Date(ev.date).getTime() > now - 2 * 3600 * 1000)
              .sort((a, b) => new Date(a.date) - new Date(b.date));
            for (const ev of future) {
              const comp = ev.competitions && ev.competitions[0];
              const hC = comp && comp.competitors && comp.competitors.find(c => c.homeAway === 'home');
              const aC = comp && comp.competitors && comp.competitors.find(c => c.homeAway === 'away');
              if (!hC || !aC) continue;
              const espnLogo = (c) => {
                const href = c.team && c.team.logos && c.team.logos[0] && c.team.logos[0].href;
                if (href) return href;
                const id = c.team && c.team.id;
                return id ? `https://a.espncdn.com/i/teamlogos/soccer/500/${id}.png` : '';
              };
              return {
                date: new Date(ev.date),
                homeTeam: hC.team.displayName || hC.team.name,
                awayTeam: aC.team.displayName || aC.team.name,
                homeLogo: espnLogo(hC),
                awayLogo: espnLogo(aC),
                providerId: String(ev.id || ''),
                provider: 'espn',
              };
            }
            return null;
          }

          async function nextSofaMatch(teamId) {
            // Sofascore a veces bloquea las IPs de GitHub (403): probar dos hosts
            const hosts = ['https://api.sofascore.com', 'https://www.sofascore.com'];
            let data = null, lastErr = '';
            for (const h of hosts) {
              try {
                const res = await fetch(`${h}/api/v1/team/${teamId}/events/next/0`, { headers: SOFA_HEADERS, signal: AbortSignal.timeout(10000) });
                if (!res.ok) { lastErr = `HTTP ${res.status}`; continue; }
                data = await res.json();
                break;
              } catch (e) { lastErr = e.message; }
            }
            if (!data) throw new Error(`Sofascore ${lastErr}`);
            const now = Date.now();
            const future = (data.events || [])
              .filter(ev => ev.startTimestamp * 1000 > now - 2 * 3600 * 1000)
              .sort((a, b) => a.startTimestamp - b.startTimestamp);
            for (const ev of future) {
              const sofaLogo = (t) => (t && t.id) ? `https://api.sofascore.com/api/v1/team/${t.id}/image` : '';
              return {
                date: new Date(ev.startTimestamp * 1000),
                homeTeam: (ev.homeTeam && ev.homeTeam.name) || '',
                awayTeam: (ev.awayTeam && ev.awayTeam.name) || '',
                homeLogo: sofaLogo(ev.homeTeam),
                awayLogo: sofaLogo(ev.awayTeam),
                providerId: String(ev.id || ''),
                provider: 'sofascore',
              };
            }
            return null;
          }

          // Plan B para la Ponfe: TheSportsDB (no bloquea IPs de servidores)
          async function nextTsdbMatch(teamName) {
            const sRes = await fetch('https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=' + encodeURIComponent(teamName), { signal: AbortSignal.timeout(10000) });
            if (!sRes.ok) throw new Error(`TheSportsDB HTTP ${sRes.status}`);
            const sData = await sRes.json();
            const team = (sData.teams || []).find(t => normalize(t.strTeam) === normalize(teamName) || normalize(t.strTeam).includes(normalize(teamName)));
            if (!team) return null;
            const nRes = await fetch('https://www.thesportsdb.com/api/v1/json/3/eventsnext.php?id=' + team.idTeam, { signal: AbortSignal.timeout(10000) });
            if (!nRes.ok) throw new Error(`TheSportsDB HTTP ${nRes.status}`);
            const nData = await nRes.json();
            const now = Date.now();
            const events = (nData.events || [])
              .map(ev => {
                const ts = ev.strTimestamp ? new Date(ev.strTimestamp) : new Date(`${ev.dateEvent}T${ev.strTime || '12:00:00'}Z`);
                return { ev, date: ts };
              })
              .filter(x => !isNaN(x.date.getTime()) && x.date.getTime() > now - 2 * 3600 * 1000)
              .sort((a, b) => a.date - b.date);
            for (const { ev, date } of events) {
              return {
                date,
                homeTeam: ev.strHomeTeam || '',
                awayTeam: ev.strAwayTeam || '',
                homeLogo: ev.strHomeTeamBadge || (normalize(ev.strHomeTeam) === normalize(team.strTeam) ? (team.strBadge || '') : ''),
                awayLogo: ev.strAwayTeamBadge || (normalize(ev.strAwayTeam) === normalize(team.strTeam) ? (team.strBadge || '') : ''),
                providerId: String(ev.idEvent || ''),
                provider: 'sofascore',
              };
            }
            return null;
          }

          async function main() {
            console.log('=== Carga automatica de partidos ===');
            console.log('Hora UTC:', new Date().toISOString(), '| force:', FORCE);

            const stateRes = await fetch(APPS_SCRIPT_URL + '?action=getState');
            const stateData = await stateRes.json();
            if (!stateData.ok || !stateData.state) { console.log('ERROR:', JSON.stringify(stateData)); process.exit(1); }
            const state = stateData.state;
            if (!Array.isArray(state.matches)) state.matches = [];

            // 1. Buscar el proximo partido de cada equipo
            const candidates = [];
            for (const team of TEAMS) {
              console.log(`\n--- ${team.name} ---`);
              let cand = null;
              try {
                cand = team.provider === 'espn'
                  ? await nextEspnMatch(team.espnTeamId)
                  : await nextSofaMatch(team.sofaTeamId);
              } catch (e) { console.log('  Error API:', e.message); }
              if (!cand && team.provider === 'sofascore') {
                try {
                  cand = await nextTsdbMatch(team.name);
                  if (cand) console.log('  (via TheSportsDB, plan B)');
                } catch (e) { console.log('  Error TheSportsDB:', e.message); }
              }
              if (!cand) { console.log('  Sin proximo partido en la API'); candidates.push(null); continue; }

              const wd = madridWeekday(cand.date);
              const local = madridLocalISO(cand.date);
              console.log(`  Proximo: ${cand.homeTeam} vs ${cand.awayTeam} | ${local} (${wd})`);

              if (!VALID_DAYS.includes(wd)) {
                console.log(`  DESCARTADO: cae en ${wd}, no es viernes-lunes. Poner manual si se quiere.`);
                candidates.push(null);
                continue;
              }
              candidates.push(cand);
            }

            // 2. Detectar Clasico (Madrid vs Barca entre ellos): solo ocupa el hueco 1
            const c0 = candidates[0];
            const involves = (c, name) => !!c && (normalize(c.homeTeam).includes(name) || normalize(c.awayTeam).includes(name));
            if (involves(c0, 'barcelona')) {
              console.log('\nCLASICO detectado: Madrid y Barca juegan entre si. El hueco 2 queda para poner manual.');
              candidates[1] = null;
            }

            // 3. Escribir cada hueco si procede
            let updated = false;
            for (const team of TEAMS) {
              const cand = candidates[team.slot];
              const slot = state.matches[team.slot];
              if (!cand) continue;
              if (!slot) continue;

              const stale = slotStale(slot);
              if (!stale && !FORCE) {
                console.log(`\nHueco ${team.slot + 1} (${team.name}): partido vigente sin terminar, no se toca (usa force para sobrescribir).`);
                continue;
              }

              const newKickoff = madridLocalISO(cand.date);
              const same = slot.homeTeam === cand.homeTeam && slot.awayTeam === cand.awayTeam && slot.kickoff === newKickoff;
              if (same) { console.log(`\nHueco ${team.slot + 1}: ya tiene este partido, sin cambios.`); continue; }

              slot.homeTeam = cand.homeTeam;
              slot.awayTeam = cand.awayTeam;
              slot.homeLogo = cand.homeLogo || '';
              slot.awayLogo = cand.awayLogo || '';
              slot.kickoff = newKickoff;
              slot.result = { home: null, away: null };
              slot.source = cand.provider;
              slot.providerId = cand.providerId;
              slot.live = null;
              slot.events = [];
              slot.lastUpdated = new Date().toISOString();
              updated = true;
              console.log(`\nHueco ${team.slot + 1} ACTUALIZADO: ${cand.homeTeam} vs ${cand.awayTeam} | ${newKickoff}`);

              // Partido nuevo en este hueco: resetear los pronosticos de ESTE
              // hueco para todos los participantes (jornada nueva). Los otros
              // huecos no se tocan, por si su partido sigue en juego.
              let cleared = 0;
              for (const p of (state.participants || [])) {
                if (Array.isArray(p.predictions) && p.predictions[team.slot] &&
                    (p.predictions[team.slot].home !== null || p.predictions[team.slot].away !== null)) {
                  cleared++;
                }
                if (Array.isArray(p.predictions)) p.predictions[team.slot] = { home: null, away: null };
                if (Array.isArray(p.locked)) p.locked[team.slot] = false;
              }
              console.log(`  Pronosticos del hueco ${team.slot + 1} reseteados (${cleared} tenian apuesta)`);
            }

            if (updated) {
              console.log('\nGuardando en Apps Script...');
              const saveRes = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'setState', state }),
              });
              const saveData = await saveRes.json().catch(() => ({}));
              console.log('Resultado guardado:', JSON.stringify(saveData));
            } else {
              console.log('\nSin cambios.');
            }
          }

          main().catch(e => { console.error('Error fatal:', e.message || e); process.exit(1); });
          SCRIPT
