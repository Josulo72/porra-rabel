                          Eliminado P{p.eliminatedAt}
                        </span>
                      )}
                    </div>
                    {/* Linea 2: chips de pronostico + accion (solo si aporta algo) */}
                    <div className="flex items-center justify-between gap-2 mt-1.5">
                      <div className="flex items-center gap-1.5 flex-wrap">
                        {p.predictions.map((pr, i) => {
                          const mr = state.matches[i]?.result;
                          const hasResult = mr && Number.isInteger(mr.home) && Number.isInteger(mr.away);
                          const hasPred = pr && Number.isInteger(pr.home) && Number.isInteger(pr.away);
                          const hit = hasResult && hasPred && Number(pr.home) === mr.home && Number(pr.away) === mr.away;
                          const miss = hasResult && (!hasPred || !hit);
                          const chipClass = hit
                            ? 'border-lime-400/60 bg-lime-400/10 text-lime-300'
                            : miss
                              ? 'border-rose-500/50 bg-rose-500/10 text-rose-300'
                              : 'border-white/10 bg-white/[0.04] text-slate-300';
                          return (
                            <span key={i} className={`score-num text-[13px] rounded-lg px-2 py-1 text-center border leading-none ${chipClass}`}>
                              {pr.home ?? '-'}-{pr.away ?? '-'}
                              {hit && <span className="ml-1">✓</span>}
                              {miss && <span className="ml-1">✗</span>}
                            </span>
                          );
                        })}
                      </div>
                      {p.status !== 'eliminated' && (canBet ? (
                        <button
                          onClick={() => openEntryModalForParticipant(p)}
                          disabled={state.matches.every((m) => isMatchLocked(m)) || (p.locked && p.locked.every(Boolean))}
                          className="tap-btn shrink-0 rounded-xl px-3 py-2 text-[11px] font-bold leading-tight text-center bg-lime-400 hover:bg-lime-300 text-slate-950 shadow-[0_6px_18px_-6px_rgba(163,230,53,0.7)] disabled:opacity-60"
                        >
                          Poner resultado
                        </button>
                      ) : (
                        <span className="shrink-0 text-[10px] font-semibold text-slate-400 text-right leading-tight">
                          {allSent ? 'Enviado ✓' : 'Cerrada'}
                        </span>
                      ))}
                    </div>
                    {adminOpen && adminLogged && (
                      <button
                        onClick={() => resetParticipantPredictions(p.id)}
                        className="tap-btn mt-2 w-full bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/40 text-rose-200 rounded-xl px-3 py-2 text-xs font-semibold"
                      >
                        Reset participante
                      </button>
                    )}
                  </article>
                );
              };

              return (
                <React.Fragment>
                  {/* Barra resumen sticky: el marcador de la porra */}
                  <div className="sticky top-2 z-30 glass rounded-2xl px-4 py-3 mb-4 shadow-[0_14px_34px_-14px_rgba(0,0,0,0.85)]">
                    <div className="flex items-center justify-between gap-3 flex-wrap">
                      <div className="flex items-baseline gap-2">
                        <span className="score-num text-3xl text-lime-300">{aliveList.length}</span>
                        <span className="font-display text-[11px] font-semibold uppercase tracking-[0.22em] text-lime-300/80">siguen vivos</span>
                      </div>
                      <div className="flex items-baseline gap-2">
                        <span className="score-num text-xl text-rose-400">{outList.length}</span>
                        <span className="font-display text-[10px] font-semibold uppercase tracking-[0.2em] text-rose-300/70">eliminados</span>
                      </div>
                      <span className="font-display text-[10px] uppercase tracking-[0.2em] text-slate-500">{totalCount} en juego</span>
                    </div>
                    <div className="mt-2.5 h-1.5 rounded-full bg-rose-500/20 overflow-hidden" role="img" aria-label={`${alivePct}% de participantes vivos`}>
                      <div
                        className="h-full rounded-full bg-gradient-to-r from-lime-400 to-cyan-400 transition-all duration-700 ease-out"
                        style={{ width: `${alivePct}%` }}

                    </div>
                  </div>

                  {/* Vivos */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-2.5">
                    {aliveList.map(renderCard)}
                  </div>

                  {/* Eliminados */}
                  {outList.length > 0 && (
                    <React.Fragment>
                      <div className="flex items-center gap-3 mt-6 mb-3">
                        <span className="h-px flex-1 bg-gradient-to-r from-transparent via-rose-500/40 to-transparent" />
                        <h2 className="font-display text-xs font-semibold uppercase tracking-[0.3em] text-rose-300/80">Caídos en combate</h2>
                        <span className="h-px flex-1 bg-gradient-to-r from-transparent via-rose-500/40 to-transparent" />
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-2.5">
                        {outList.map(renderCard)}

                <p className="text-sm mt-1 font-semibold opacity-80">{goalToast.full}</p>
              </div>
            </div>
          )}

          {/* Toast de guardado */}
          {saveToast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[70] toast-in">
              <div className="glass border border-lime-400/40 text-slate-100 px-5 py-3 rounded-2xl shadow-[0_16px_40px_-14px_rgba(0,0,0,0.9)] text-center min-w-[260px]">
                <p className="text-sm font-semibold"><span className="text-lime-300">✓</span> {saveToast}</p>
              </div>

          {/* Botón fijo de notificaciones */}
          {notifPermission !== 'granted' && typeof Notification !== 'undefined' && (
            <button
              onClick={requestNotifPermission}
              className="tap-btn fixed bottom-4 right-4 z-50 bg-lime-400 hover:bg-lime-300 text-slate-950 rounded-full px-5 py-3 text-xs font-extrabold shadow-[0_12px_30px_-8px_rgba(163,230,53,0.8)]"
            >
              🔔 Activar notificaciones de gol
            </button>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
