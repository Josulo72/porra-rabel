<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Porra de Supervivencia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            night: '#04080d',
            pitch: '#0a2416',
            limeGlow: '#bef264',
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Oswald', '"Arial Narrow"', 'sans-serif'],
            block: ['"Archivo Black"', 'Impact', 'sans-serif'],
          },
          boxShadow: {
            neon: '0 0 0 1px rgba(163,230,53,.28), 0 0 30px -6px rgba(163,230,53,.30)',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --lime: #a3e635;
      --lime-soft: #bef264;
      --cyan: #22d3ee;
    }

    /* ===== Estadio nocturno: cielo, focos y césped ===== */
    /* Base sólida oscura en body; el decorado va en una capa fija (body::before),
       porque background-attachment: fixed falla en Safari de iOS. */
    body {
      color: #e9f1ec;
      min-height: 100vh;
      background-color: #04080d;
    }

    /* Focos, franjas de césped y vignette, fijos tras el contenido */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(90deg,
          rgba(255, 255, 255, 0.016) 0px, rgba(255, 255, 255, 0.016) 90px,
          transparent 90px, transparent 180px),
        radial-gradient(ellipse 130% 95% at 50% 115%, transparent 52%, rgba(1, 4, 8, 0.6) 100%),
        radial-gradient(ellipse 95% 55% at 50% -14%, rgba(190, 242, 100, 0.14), transparent 62%),
        radial-gradient(ellipse 44% 34% at 6% -6%, rgba(34, 211, 238, 0.13), transparent 72%),
        radial-gradient(ellipse 44% 34% at 94% -6%, rgba(34, 211, 238, 0.10), transparent 72%),
        linear-gradient(180deg, #04080d 0%, #071310 44%, #0a2416 100%);
      z-index: 0;
    }

    #root {
      position: relative;
      z-index: 1;
    }

    /* ===== Paneles de cristal ===== */
    .glass {
      background: linear-gradient(165deg, rgba(17, 30, 25, 0.90), rgba(7, 14, 12, 0.74));
      border: 1px solid rgba(163, 230, 53, 0.13);
      box-shadow: 0 18px 42px -20px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* ===== Tipografía de marcador ===== */
    .score-num {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: 0.01em;
    }

    .wordmark {
      font-family: 'Archivo Black', Impact, sans-serif;
      letter-spacing: 0.01em;
      background: linear-gradient(98deg, #f4fde6 0%, #bef264 48%, #22d3ee 105%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 3px 20px rgba(163, 230, 53, 0.28));
    }

    /* ===== Entrada de tarjetas (escalonada vía animation-delay inline) ===== */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-in { animation: cardIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }

    /* ===== Pulso de superviviente ===== */
    @keyframes aliveGlow {
      0%, 100% { box-shadow: 0 0 0 1px rgba(163, 230, 53, 0.35), 0 0 16px -7px rgba(163, 230, 53, 0.45); }
      50% { box-shadow: 0 0 0 1.5px rgba(163, 230, 53, 0.8), 0 0 26px -4px rgba(163, 230, 53, 0.6); }
    }

    .animate-alive { animation: aliveGlow 2.6s ease-in-out infinite; }

    /* ===== Flash de gol ===== */
    @keyframes goalFlash {
      0% { transform: scale(1); filter: brightness(1); }
      16% { transform: scale(1.22); filter: brightness(1.7) drop-shadow(0 0 22px rgba(190, 242, 100, 0.95)); }
      45% { transform: scale(1.04); filter: brightness(1.25) drop-shadow(0 0 10px rgba(190, 242, 100, 0.5)); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .animate-goal { animation: goalFlash 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 2; }

    /* ===== Pulso EN VIVO ===== */
    @keyframes livePing {
      0% { box-shadow: 0 0 0 0 rgba(163, 230, 53, 0.6); }
      70% { box-shadow: 0 0 0 9px rgba(163, 230, 53, 0); }
      100% { box-shadow: 0 0 0 0 rgba(163, 230, 53, 0); }
    }

    .live-dot { animation: livePing 1.5s cubic-bezier(0, 0, 0.2, 1) infinite; }

    /* ===== Toasts ===== */
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, -18px) scale(0.94); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }

    .toast-in { animation: toastIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) both; }

    /* ===== Eliminados: apagados con estilo, pero legibles ===== */
    .eliminated {
      opacity: 0.85;
      filter: grayscale(0.6);
    }
    /* El nombre siempre a plena legibilidad, tambien en eliminados */
    .participant-name {
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
    }

    .tap-btn {
      min-height: 44px;
      transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.25s ease, opacity 0.2s ease, color 0.2s ease;
    }

    .tap-btn:active { transform: scale(0.97); }

    .mobile-modal {
      max-height: calc(100vh - 1rem);
      overflow-y: auto;
    }

    .team-name {
      word-break: break-word;
      line-height: 1.2;
    }

    input, select, textarea { color-scheme: dark; }

    input:focus-visible, button:focus-visible {
      outline: 2px solid rgba(34, 211, 238, 0.65);
      outline-offset: 1px;
    }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(163, 230, 53, 0.18); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(163, 230, 53, 0.32); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body class="font-inter text-slate-100 min-h-screen">
  <div id="root" class="max-w-7xl mx-auto px-4 py-6 md:py-10"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const STORAGE_KEY = 'porra_supervivencia_v1';
    const API_BASE = 'https://script.google.com/macros/s/AKfycbwIo68AUaC7Sd9eXKWGUWcCP6Be24j-9TmkHNEVKSmfOVIT5fQen3Kq5mqWlwLSyXq86w/exec';
    const ADMIN_KEY = 'porra_admin_visible';
    const ADMIN_SESSION_KEY = 'porra_admin_session_v1';
    const SCRAPE_MS = 45000;
    const REMOTE_SYNC_MS = 3000;
    const REMOTE_POLL_MS = 30000; // Polling para ver cambios de otros usuarios

    const DEFAULT_MATCHES = [
      { id: 'm1', order: 1, homeTeam: 'Real Madrid', awayTeam: '', kickoff: '' },
      { id: 'm2', order: 2, homeTeam: 'FC Barcelona', awayTeam: '', kickoff: '' },
      { id: 'm3', order: 3, homeTeam: 'SD Ponferradina', awayTeam: '', kickoff: '' },
    ];

    const KNOWN_TEAM_LOGOS = {
      'madrid': 'https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg',
      'real madrid': 'https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg',
      'barcelona': 'https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg',
      'fc barcelona': 'https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg',
      'ponferradina': 'https://upload.wikimedia.org/wikipedia/en/0/01/SD_Ponferradina_logo.png',
      'sd ponferradina': 'https://upload.wikimedia.org/wikipedia/en/0/01/SD_Ponferradina_logo.png',
      'atlético de madrid': 'https://crests.football-data.org/78.svg',
      'atletico de madrid': 'https://crests.football-data.org/78.svg',
      'celta de vigo': 'https://upload.wikimedia.org/wikipedia/en/1/12/RC_Celta_de_Vigo_logo.svg',
      'aviles': 'https://tmssl.akamaized.net/images/wappen/head/26459.png',
      'avilés': 'https://tmssl.akamaized.net/images/wappen/head/26459.png',
      'sevilla': 'https://upload.wikimedia.org/wikipedia/en/thumb/3/3b/Sevilla_FC_logo.svg/250px-Sevilla_FC_logo.svg.png',
      'sevilla fc': 'https://upload.wikimedia.org/wikipedia/en/thumb/3/3b/Sevilla_FC_logo.svg/250px-Sevilla_FC_logo.svg.png',
      'betis': 'https://upload.wikimedia.org/wikipedia/en/thumb/1/13/Real_betis_logo.svg/250px-Real_betis_logo.svg.png',
      'real betis': 'https://upload.wikimedia.org/wikipedia/en/thumb/1/13/Real_betis_logo.svg/250px-Real_betis_logo.svg.png',
      'arenteiro': 'https://upload.wikimedia.org/wikipedia/en/thumb/f/f8/CD_Arenteiro_logo.svg/250px-CD_Arenteiro_logo.svg.png',
      'cd arenteiro': 'https://upload.wikimedia.org/wikipedia/en/thumb/f/f8/CD_Arenteiro_logo.svg/250px-CD_Arenteiro_logo.svg.png',
      'club deportivo arenteiro': 'https://upload.wikimedia.org/wikipedia/en/thumb/f/f8/CD_Arenteiro_logo.svg/250px-CD_Arenteiro_logo.svg.png',
    };

    const defaultParticipants = Array.from({ length: 26 }).map((_, i) => ({
      id: crypto.randomUUID(),
      name: `Jugador ${String(i + 1).padStart(2, '0')}`,
      predictions: [null, null, null],
      locked: [false, false, false],
    }));

    const defaultState = {
      matches: DEFAULT_MATCHES.map((m) => ({
        id: m.id,
        order: m.order,
        homeTeam: m.homeTeam,
        awayTeam: m.awayTeam,
        kickoff: m.kickoff,
        result: { home: null, away: null },
        source: 'manual',
        lastUpdated: null,
      })),
      participants: defaultParticipants,
    };

    const toIntOrNull = (v) => {
      if (v === '' || v === null || v === undefined) return null;
      const n = Number(v);
      return Number.isFinite(n) && n >= 0 ? Math.floor(n) : null;
    };

    const normalizeTeamName = (name) => String(name || '').toLowerCase()
      .replace(/^(sd|cf|fc|cd|ud|ca|rc|rcd|real|deportivo|sociedad deportiva|club)\s+/i, '')
      .replace(/\s+/g, ' ')
      .trim();

    const isResultSet = (result) => Number.isInteger(result.home) && Number.isInteger(result.away);

    const evaluateParticipant = (participant, matches) => {
      for (let i = 0; i < matches.length; i++) {
        const match = matches[i];
        if (!isResultSet(match.result)) {
          // Partido sin resultado aún — seguimos evaluando en orden
          return { status: 'alive', eliminatedAt: null };
        }
        const pred = participant.predictions?.[i];
        // Si no tiene predicción (null) para un partido con resultado → eliminado
        if (!pred || pred.home === null || pred.home === undefined || pred.away === null || pred.away === undefined) {
          return { status: 'eliminated', eliminatedAt: i + 1 };
        }
        const exact = Number(pred.home) === match.result.home && Number(pred.away) === match.result.away;
        if (!exact) {
          return { status: 'eliminated', eliminatedAt: i + 1 };
        }
      }
      return { status: 'alive', eliminatedAt: null };
    };

    const parseScoreCell = (cell) => {
      if (cell === null || cell === undefined || cell === '') return { home: null, away: null };
      if (typeof cell === 'string') {
        const m = cell.trim().match(/^(\d+)\s*[-:]\s*(\d+)$/);
        if (m) return { home: Number(m[1]), away: Number(m[2]) };
      }
      return { home: null, away: null };
    };

    const normalizeParticipantRow = (row) => {
      const keys = Object.keys(row).reduce((acc, k) => {
        acc[k.toLowerCase().trim()] = row[k];
        return acc;
      }, {});
      const name = keys.nombre || keys.name || keys.usuario || keys.player || keys.participante;
      if (!name) return null;
      return {
        id: crypto.randomUUID(),
        name: String(name).trim(),
        predictions: [
          { home: toIntOrNull(keys.p1_local ?? keys.m1_local ?? keys.rm_goles), away: toIntOrNull(keys.p1_visitante ?? keys.m1_visitante ?? keys.rival1_goles) },
          { home: toIntOrNull(keys.p2_local ?? keys.m2_local ?? keys.barca_goles), away: toIntOrNull(keys.p2_visitante ?? keys.m2_visitante ?? keys.rival2_goles) },
          { home: toIntOrNull(keys.p3_local ?? keys.m3_local ?? keys.ponfe_goles), away: toIntOrNull(keys.p3_visitante ?? keys.m3_visitante ?? keys.rival3_goles) },
        ],
      };
    };

    const normalizeParticipantRowFromMatchColumns = (row, matchHeaders) => {
      const cols = Object.keys(row);
      if (!cols.length) return null;
      const nameKey = cols[0];
      const name = row[nameKey];
      if (!name || typeof name !== 'string') return null;

      const preds = matchHeaders.slice(0, 3).map((h) => parseScoreCell(row[h]));
      return {
        id: crypto.randomUUID(),
        name: String(name).trim(),
        predictions: [
          preds[0] || { home: null, away: null },
          preds[1] || { home: null, away: null },
          preds[2] || { home: null, away: null },
        ],
      };
    };

    const normalizeStateFromSource = (raw) => {
      if (!raw || typeof raw !== 'object') return defaultState;

      const matchesSource = Array.isArray(raw.matches) ? raw.matches : [];
      const participantsSource = Array.isArray(raw.participants) ? raw.participants : [];

      const matches = defaultState.matches.map((base, i) => {
        const src = matchesSource[i] || {};
        return {
          id: base.id,
          order: base.order,
          homeTeam: String(src.homeTeam ?? base.homeTeam ?? ''),
          awayTeam: String(src.awayTeam ?? base.awayTeam ?? ''),
          kickoff: String(src.kickoff ?? base.kickoff ?? ''),
          result: {
            home: toIntOrNull(src.result?.home),
            away: toIntOrNull(src.result?.away),
          },
          flashscoreUrl: String(src.flashscoreUrl || ''),
          source: ['scraping', 'espn', 'sofascore'].includes(src.source) ? src.source : 'manual',
          providerId: String(src.providerId || ''),
          homeLogo: String(src.homeLogo || ''),
          awayLogo: String(src.awayLogo || ''),
          live: src.live && typeof src.live === 'object'
            ? {
                minute: String(src.live.minute || ''),
                status: String(src.live.status || ''),
                phase: String(src.live.phase || ''),
              }
            : null,
          events: Array.isArray(src.events)
            ? src.events
                .filter((e) => e && typeof e === 'object')
                .map((e) => ({
                  minute: String(e.minute || ''),
                  type: ['goal', 'yellow', 'red'].includes(e.type) ? e.type : 'goal',
                  player: String(e.player || ''),
                  side: e.side === 'away' ? 'away' : 'home',
                }))
            : [],
          lastUpdated: src.lastUpdated || null,
        };
      });

      const participants = participantsSource.map((p) => ({
        id: p.id || crypto.randomUUID(),
        name: String(p.name || '').trim(),
        predictions: [0, 1, 2].map((idx) => ({
          home: toIntOrNull(p.predictions?.[idx]?.home),
          away: toIntOrNull(p.predictions?.[idx]?.away),
        })),
        locked: [0, 1, 2].map((idx) => Boolean(p.locked?.[idx])),
      })).filter((p) => p.name);

      return {
        matches,
        participants: participants.length ? participants : defaultState.participants,
      };
    };

    function App() {
      const [state, setState] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? normalizeStateFromSource(JSON.parse(raw)) : defaultState;
        } catch {
          return defaultState;
        }
      });
      const [adminOpen, setAdminOpen] = useState(() => localStorage.getItem(ADMIN_KEY) === '1');
      const [adminLogged, setAdminLogged] = useState(() => localStorage.getItem(ADMIN_SESSION_KEY) === '1');
      const [adminLoginOpen, setAdminLoginOpen] = useState(false);
      const [adminUser, setAdminUser] = useState('');
      const [adminPass, setAdminPass] = useState('');
      const [adminLoginMsg, setAdminLoginMsg] = useState('');
      const [logs, setLogs] = useState([]);
      const [logoCache, setLogoCache] = useState({});
      const [flashMap, setFlashMap] = useState({});
      const [goalToast, setGoalToast] = useState(null);
      const [saveToast, setSaveToast] = useState(null);
      const [now, setNow] = useState(new Date());
      const [notifPermission, setNotifPermission] = useState(typeof Notification !== 'undefined' ? Notification.permission : 'denied');
      const [waConfig, setWaConfig] = useState({ enabled: false, recipients: [] });
      const [waPhone, setWaPhone] = useState('');
      const [waApiKey, setWaApiKey] = useState('');
      const [waMsg, setWaMsg] = useState('');
      const [tgConfig, setTgConfig] = useState({ enabled: false, botToken: '', chatId: '' });
      const [tgMsg, setTgMsg] = useState('');
      const [scrapingEnabled, setScrapingEnabled] = useState(() => {
        try { return localStorage.getItem('porra_scraping_enabled') !== '0'; } catch { return true; }
      });
      const [scrapeStatus, setScrapeStatus] = useState({
        level: 'waiting',
        text: 'Iniciando...',
      });
      const [entryOpen, setEntryOpen] = useState(false);
      const [entryParticipantId, setEntryParticipantId] = useState('');
      const [entryName, setEntryName] = useState('');
      const [entryPreds, setEntryPreds] = useState([
        { home: '', away: '' },
        { home: '', away: '' },
        { home: '', away: '' },
      ]);
      const [entryLocks, setEntryLocks] = useState([false, false, false]);
      const [submitMsg, setSubmitMsg] = useState('');
      const [storageMode, setStorageMode] = useState('init');
      const saveTimer = useRef(null);

      const sharedApiConfigured = () => API_BASE && !API_BASE.includes('REEMPLAZAR_CON_TU_DEPLOY');

      const loadSharedState = async () => {
        if (!sharedApiConfigured()) {
          setStorageMode('local');
          return;
        }
        try {
          const res = await fetch(`${API_BASE}?action=getState`, { method: 'GET' });
          if (!res.ok) throw new Error('No se pudo leer estado remoto');
          const data = await res.json();
          if (data?.state) setState(normalizeStateFromSource(data.state));
          setStorageMode('shared');
        } catch {
          setStorageMode('local');
          pushLog('Sin backend compartido: modo local');
        }
      };

      // Ids de participantes tocados explicitamente por el admin (reset, etc.)
      // y bandera de operacion masiva (resetear jornada, importar, invertir).
      // Sirven para que la fusion previa al envio no deshaga cambios del admin.
      const adminTouchedRef = useRef(new Set());
      const adminBulkRef = useRef(false);

      const saveSharedState = async (nextState) => {
        if (!sharedApiConfigured() || storageMode !== 'shared') return;
        try {
          // Fusion previa: releer el servidor y conservar pronosticos que otros
          // participantes hayan guardado mientras este navegador tenia datos viejos.
          let stateToSend = nextState;
          try {
            const res = await fetch(`${API_BASE}?action=getState`, { method: 'GET' });
            const data = await res.json();
            const server = data?.state;
            if (server && Array.isArray(server.participants)) {
              const touched = adminTouchedRef.current;
              const bulk = adminBulkRef.current;
              const locals = [...(nextState.participants || [])];
              const byId = new Map(locals.map((p, i) => [p.id, i]));
              const byName = new Map(locals.map((p, i) => [String(p.name || '').trim().toLowerCase(), i]));
              for (const sp of server.participants) {
                const li = byId.has(sp.id) ? byId.get(sp.id) : byName.get(String(sp.name || '').trim().toLowerCase());
                if (li === undefined) {
                  // Participante nuevo registrado desde otro dispositivo: conservarlo
                  if (!touched.has(sp.id)) locals.push(sp);
                  continue;
                }
                if (bulk || touched.has(locals[li].id)) continue;
                const lp = locals[li];
                const preds = [...(lp.predictions || [])];
                const locks = [...(lp.locked || [false, false, false])];
                let changed = false;
                for (let i = 0; i < 3; i++) {
                  const sLock = Boolean(sp.locked?.[i]);
                  const sPred = sp.predictions?.[i];
                  const lHasPred = Number.isInteger(preds[i]?.home) && Number.isInteger(preds[i]?.away);
                  if (sLock && !locks[i] && !lHasPred && sPred) {
                    preds[i] = { home: sPred.home, away: sPred.away };
                    locks[i] = true;
                    changed = true;
                  }
                }
                if (changed) locals[li] = { ...lp, predictions: preds, locked: locks };
              }
              stateToSend = { ...nextState, participants: locals };
            }
          } catch {
            // si falla la lectura previa, enviar tal cual
          }
          const body = JSON.stringify({
            action: 'setState',
            state: stateToSend,
          });
          const postRes = await fetch(API_BASE, {
            method: 'POST',
            body,
          });
          if (postRes.ok) {
            adminTouchedRef.current = new Set();
            adminBulkRef.current = false;
          }
        } catch {
          pushLog('Error guardando en backend compartido');
        }
      };

      // Actualización atómica de un solo participante (evita race conditions).
      // Reintenta hasta 3 veces y devuelve true solo si el servidor confirmó.
      const saveParticipantRemote = async (participant) => {
        if (!sharedApiConfigured() || storageMode !== 'shared') return true;
        const body = JSON.stringify({ action: 'updateParticipant', participant });
        for (let attempt = 0; attempt < 3; attempt++) {
          try {
            const res = await fetch(API_BASE, { method: 'POST', body });
            const data = await res.json().catch(() => null);
            if (res.ok && data && data.ok !== false) return true;
          } catch {
            // reintentar
          }
          await new Promise((r) => setTimeout(r, 700 * (attempt + 1)));
        }
        pushLog('Error guardando participante en backend');
        return false;
      };

      useEffect(() => {
        loadSharedState();
      }, []);

      // Polling remoto: sincroniza el estado cada 30s para ver cambios de otros usuarios/admin
      useEffect(() => {
        if (storageMode !== 'shared') return;
        const pollId = setInterval(() => {
          loadSharedState();
        }, REMOTE_POLL_MS);
        return () => clearInterval(pollId);
      }, [storageMode]);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }, [state]);

      // Tick cada segundo para countdown
      useEffect(() => {
        const id = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(id);
      }, []);

      // El envio del estado COMPLETO solo lo hace el admin logueado.
      // Los navegadores de participantes guardan solo su pronostico via
      // updateParticipant (atomico con cerrojo en el servidor); asi dos
      // personas guardando a la vez ya no se pisan.
      useEffect(() => {
        if (storageMode !== 'shared') return;
        if (!adminLogged) return;
        if (saveTimer.current) clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(() => {
          saveSharedState(state);
        }, REMOTE_SYNC_MS);
        return () => {
          if (saveTimer.current) clearTimeout(saveTimer.current);
        };
      }, [state, storageMode, adminLogged]);

      useEffect(() => {
        localStorage.setItem(ADMIN_KEY, adminOpen ? '1' : '0');
      }, [adminOpen]);

      useEffect(() => {
        localStorage.setItem(ADMIN_SESSION_KEY, adminLogged ? '1' : '0');
      }, [adminLogged]);

      useEffect(() => {
        localStorage.setItem('porra_scraping_enabled', scrapingEnabled ? '1' : '0');
      }, [scrapingEnabled]);

      const requestAdminAccess = () => {
        if (adminLogged) {
          setAdminOpen((v) => !v);
          return;
        }
        setAdminUser('');
        setAdminPass('');
        setAdminLoginMsg('');
        setAdminLoginOpen(true);
      };

      const doAdminLogin = () => {
        if (adminUser === 'ADMIN' && adminPass === '1234') {
          setAdminLogged(true);
          setAdminOpen(true);
          setAdminLoginOpen(false);
          setAdminLoginMsg('');
          return;
        }
        setAdminLoginMsg('Credenciales incorrectas');
      };

      const doAdminLogout = () => {
        setAdminOpen(false);
        setAdminLogged(false);
        setAdminLoginOpen(false);
        setAdminUser('');
        setAdminPass('');
        setAdminLoginMsg('');
      };

      useEffect(() => {
        const onKey = (e) => {
          if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') {
            requestAdminAccess();
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [adminLogged]);

      const evaluatedParticipants = useMemo(() => {
        return state.participants.map((p) => ({ ...p, ...evaluateParticipant(p, state.matches) }));
      }, [state.participants, state.matches]);

      const aliveCount = evaluatedParticipants.filter((p) => p.status === 'alive').length;

      // WhatsApp config
      const loadWaConfig = async () => {
        if (!sharedApiConfigured()) return;
        try {
          const res = await fetch(`${API_BASE}?action=getWhatsAppConfig`);
          const data = await res.json();
          if (data?.config) setWaConfig(data.config);
        } catch {}
      };
      const saveWaConfig = async (config) => {
        if (!sharedApiConfigured()) return;
        try {
          await fetch(API_BASE, { method: 'POST', body: JSON.stringify({ action: 'setWhatsAppConfig', waConfig: config }) });
          setWaConfig(config);
          setWaMsg('Configuración guardada');
        } catch { setWaMsg('Error al guardar'); }
      };
      const addWaRecipient = () => {
        if (!waPhone || !waApiKey) { setWaMsg('Rellena teléfono y API key'); return; }
        const next = { ...waConfig, recipients: [...(waConfig.recipients || []), { phone: waPhone, apikey: waApiKey }] };
        saveWaConfig(next);
        setWaPhone('');
        setWaApiKey('');
      };
      const removeWaRecipient = (idx) => {
        const next = { ...waConfig, recipients: waConfig.recipients.filter((_, i) => i !== idx) };
        saveWaConfig(next);
      };
      const toggleWa = () => {
        const next = { ...waConfig, enabled: !waConfig.enabled };
        saveWaConfig(next);
      };
      const testWa = async () => {
        if (!sharedApiConfigured()) return;
        try {
          await fetch(API_BASE, { method: 'POST', body: JSON.stringify({ action: 'testWhatsApp' }) });
          setWaMsg('Mensaje de test enviado');
        } catch { setWaMsg('Error al enviar test'); }
      };
      // Telegram config
      const loadTgConfig = async () => {
        if (!sharedApiConfigured()) return;
        try {
          const res = await fetch(`${API_BASE}?action=getTelegramConfig`);
          const data = await res.json();
          if (data?.config) setTgConfig(data.config);
        } catch {}
      };
      const saveTgConfig = async (config) => {
        if (!sharedApiConfigured()) return;
        try {
          await fetch(API_BASE, { method: 'POST', body: JSON.stringify({ action: 'setTelegramConfig', tgConfig: config }) });
          setTgConfig(config);
          setTgMsg('Configuración guardada');
        } catch { setTgMsg('Error al guardar'); }
      };
      const testTg = async () => {
        if (!sharedApiConfigured()) return;
        try {
          await fetch(API_BASE, { method: 'POST', body: JSON.stringify({ action: 'testTelegram' }) });
          setTgMsg('Mensaje de test enviado');
        } catch { setTgMsg('Error al enviar test'); }
      };

      useEffect(() => { if (adminLogged) { loadWaConfig(); loadTgConfig(); } }, [adminLogged]);

      const setMatchField = (index, field, value) => {
        setState((prev) => {
          const matches = [...prev.matches];
          matches[index] = { ...matches[index], [field]: value };
          return { ...prev, matches };
        });
      };

      const setResult = (index, side, value, source = 'manual') => {
        setState((prev) => {
          const matches = [...prev.matches];
          const match = { ...matches[index] };
          match.result = { ...match.result, [side]: toIntOrNull(value) };
          match.source = source;
          match.lastUpdated = new Date().toISOString();
          matches[index] = match;
          return { ...prev, matches };
        });
      };

      const swapHomeAway = (index) => {
        adminBulkRef.current = true;
        setState((prev) => {
          const matches = [...prev.matches];
          const m = { ...matches[index] };
          matches[index] = {
            ...m,
            homeTeam: m.awayTeam,
            awayTeam: m.homeTeam,
            result: { home: m.result.away, away: m.result.home },
          };
          // Intercambiar predicciones de todos los participantes para este partido
          const participants = prev.participants.map((p) => {
            const preds = [...p.predictions];
            const pr = preds[index];
            if (pr) preds[index] = { home: pr.away, away: pr.home };
            return { ...p, predictions: preds };
          });
          return { ...prev, matches, participants };
        });
      };

      const openEntryModal = () => {
        setEntryOpen(true);
        setEntryParticipantId('');
        setEntryName('');
        setEntryPreds([
          { home: '', away: '' },
          { home: '', away: '' },
          { home: '', away: '' },
        ]);
        setEntryLocks([false, false, false]);
        setSubmitMsg('');
      };

      const openEntryModalForParticipant = (participant) => {
        setEntryOpen(true);
        setEntryParticipantId(participant.id);
        setEntryName(participant.name);
        setEntryPreds(participant.predictions.map((pr) => ({ home: pr.home ?? '', away: pr.away ?? '' })));
        setEntryLocks(participant.locked || [false, false, false]);
        setSubmitMsg('');
      };

      const updateEntryPred = (i, side, v) => {
        setEntryPreds((prev) => {
          const next = [...prev];
          next[i] = { ...next[i], [side]: v };
          return next;
        });
      };

      const showSaveToast = (msg) => {
        setSaveToast(msg);
        setTimeout(() => setSaveToast(null), 2200);
      };

      const saveParticipantPrediction = async () => {
        const cleanName = entryName.trim();
        if (!cleanName) {
          setSubmitMsg('Escribe tu nombre.');
          return;
        }
        const parsed = entryPreds.map((pr) => ({ home: toIntOrNull(pr.home), away: toIntOrNull(pr.away) }));

        // Calcular nuevo estado y resultado SIN depender del callback de setState
        const matchLocks = state.matches.map((m) => isMatchLocked(m));
        let idx = -1;
        if (entryParticipantId) {
          idx = state.participants.findIndex((p) => p.id === entryParticipantId);
        }
        if (idx < 0) {
          idx = state.participants.findIndex((p) => p.name.trim().toLowerCase() === cleanName.toLowerCase());
        }

        let nextParticipants = null;
        let savedParticipant = null;
        let outcome = '';

        if (idx >= 0) {
          const existing = state.participants[idx];
          const existingPreds = existing.predictions || [{ home: null, away: null }, { home: null, away: null }, { home: null, away: null }];
          const existingLocks = existing.locked || [false, false, false];
          const isBlocked = (i) => matchLocks[i];

          const nextPreds = parsed.map((pr, i) => isBlocked(i) ? existingPreds[i] || { home: null, away: null } : pr);
          const nextLocks = existingLocks.map((lk, i) => {
            if (lk && matchLocks[i]) return true;
            if (matchLocks[i]) return true;
            return Number.isInteger(nextPreds[i].home) && Number.isInteger(nextPreds[i].away);
          });

          const unlockedValid = nextPreds.every((pr, i) => isBlocked(i) || (Number.isInteger(pr.home) && Number.isInteger(pr.away)));
          if (!unlockedValid) {
            setSubmitMsg('Completa con números válidos los partidos aún abiertos.');
            return;
          }
          const allBlocked = [0, 1, 2].every((i) => isBlocked(i));
          if (allBlocked) {
            setSubmitMsg('Todos tus pronósticos ya están bloqueados. No puedes modificarlos.');
            return;
          }

          const updated = { ...existing, predictions: nextPreds, locked: nextLocks };
          nextParticipants = [...state.participants];
          nextParticipants[idx] = updated;
          savedParticipant = updated;
          outcome = `Pronóstico guardado para ${existing.name}.`;
        } else {
          if (matchLocks.some(Boolean)) {
            setSubmitMsg('No se pueden crear nuevos participantes después del inicio de partidos.');
            return;
          }
          const newValid = parsed.every((pr) => Number.isInteger(pr.home) && Number.isInteger(pr.away));
          if (!newValid) {
            setSubmitMsg('Completa los 3 marcadores con números válidos.');
            return;
          }
          if (state.participants.length >= 26) {
            setSubmitMsg('No hay plazas libres. Usa exactamente un nombre ya registrado.');
            return;
          }
          savedParticipant = {
            id: crypto.randomUUID(),
            name: cleanName,
            predictions: parsed,
            locked: [true, true, true],
          };
          nextParticipants = [...state.participants, savedParticipant];
          outcome = `Pronóstico guardado para ${cleanName}.`;
        }

        setState((prev) => ({ ...prev, participants: nextParticipants }));
        setSubmitMsg('');
        setEntryOpen(false);
        scrollToTop();
        if (savedParticipant) {
          const ok = await saveParticipantRemote(savedParticipant);
          if (ok) {
            showSaveToast(outcome);
            // Releer el estado del servidor para quedar en sync con el merge
            if (storageMode === 'shared') loadSharedState();
          } else {
            showSaveToast('⚠️ No se pudo guardar en el servidor. Comprueba tu conexión y vuelve a intentarlo.');
            // Desbloquear localmente lo que no llegó al servidor para permitir reintento
            setState((prev) => ({
              ...prev,
              participants: prev.participants.map((p) =>
                p.id === savedParticipant.id ? { ...p, locked: [false, false, false] } : p
              ),
            }));
          }
        } else {
          showSaveToast(outcome);
        }
      };

      const pushLog = (text) => {
        setLogs((prev) => [`${new Date().toLocaleTimeString('es-ES')} - ${text}`, ...prev].slice(0, 8));
      };

      const flashGoal = (matchId, side) => {
        const key = `${matchId}-${side}`;
        setFlashMap((prev) => ({ ...prev, [key]: true }));
        setTimeout(() => {
          setFlashMap((prev) => ({ ...prev, [key]: false }));
        }, 1400);
      };

      const isLiveWindow = (kickoff) => {
        if (!kickoff) return false;
        const now = new Date();
        const ko = new Date(kickoff);
        const start = new Date(ko.getTime() - 30 * 60 * 1000); // 30 min antes del kickoff
        const end = new Date(ko.getTime() + 250 * 60 * 1000); // 4h10min después (cubre prórrogas y penaltis)
        return now >= start && now <= end;
      };

      const isMatchLocked = (match) => {
        if (!match.kickoff) return false;
        return new Date() >= new Date(match.kickoff);
      };

      const getMatchPhase = (match) => {
        if (!match.kickoff) return { level: 'waiting', text: 'Esperando (sin hora)' };
        const now = new Date();
        const ko = new Date(match.kickoff);
        const start = new Date(ko.getTime() - 30 * 60 * 1000);
        const end = new Date(ko.getTime() + 250 * 60 * 1000);
        if (now < start) return { level: 'waiting', text: 'Esperando partido' };
        if (now >= start && now <= end) return { level: 'active', text: 'Partido activo' };
        if (isResultSet(match.result)) return { level: 'ended', text: 'Partido terminado ✓' };
        return { level: 'ended', text: 'Partido terminado — pendiente resultado' };
      };

      const getCountdown = (match) => {
        if (!match.kickoff) return null;
        const ko = new Date(match.kickoff);
        const diff = ko.getTime() - now.getTime();
        if (diff <= 0) return null; // ya empezó
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        if (h > 24) {
          const days = Math.floor(h / 24);
          return `${days}d ${h % 24}h`;
        }
        return `${h}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
      };

      // Service Worker registration
      const swRef = useRef(null);
      useEffect(() => {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            swRef.current = reg;
          }).catch(() => {});
        }
      }, []);

      const requestNotifPermission = async () => {
        if (typeof Notification === 'undefined') return;
        const perm = await Notification.requestPermission();
        setNotifPermission(perm);
      };

      const sendBrowserNotification = (title, body, tag, persistent = false) => {
        if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
        // Usar Service Worker para que funcione con la web en segundo plano
        if (swRef.current && swRef.current.active) {
          swRef.current.active.postMessage({
            type: 'SHOW_NOTIFICATION',
            title,
            body,
            tag: tag || 'porra-' + Date.now(),
            persistent,
          });
        } else {
          try { new Notification(title, { body }); } catch {}
        }
      };

      const showGoalToast = (teamHome, teamAway, homeScore, awayScore, changedSide) => {
        const msg = changedSide === 'home'
          ? `⚽ GOL ${teamHome}! ${homeScore}-${awayScore}`
          : `⚽ GOL ${teamAway}! ${homeScore}-${awayScore}`;
        setGoalToast({ msg, full: `${teamHome} ${homeScore} - ${awayScore} ${teamAway}` });
        sendBrowserNotification('⚽ ¡GOL en La Porra!', `${teamHome} ${homeScore} - ${awayScore} ${teamAway}`, 'goal');
        setTimeout(() => setGoalToast(null), 5000);
      };

      // Notificaciones de fases de partido (inicio, descanso, reanudación, final)
      // Detección universal de goles: funciona tanto con scraping como con entrada manual
      const prevResultsRef = useRef(null);
      useEffect(() => {
        // Inicializar en la primera carga sin notificar
        if (prevResultsRef.current === null) {
          prevResultsRef.current = state.matches.map((m) => ({
            home: m.result.home,
            away: m.result.away,
          }));
          return;
        }
        state.matches.forEach((m, idx) => {
          const prev = prevResultsRef.current[idx];
          const curr = m.result;
          if (!prev || !isResultSet(curr)) return;
          // Detectar cambio de marcador (solo si el anterior también era válido — evita notificar al poner el primer resultado)
          if (isResultSet({ home: prev.home, away: prev.away })) {
            if (prev.home !== curr.home) {
              flashGoal(m.id, 'home');
              showGoalToast(m.homeTeam, m.awayTeam, curr.home, curr.away, 'home');
            }
            if (prev.away !== curr.away) {
              flashGoal(m.id, 'away');
              showGoalToast(m.homeTeam, m.awayTeam, curr.home, curr.away, 'away');
            }
          } else if (!isResultSet({ home: prev.home, away: prev.away }) && isResultSet(curr)) {
            // Primera vez que se establece resultado completo — flash pero sin notificación de gol
            flashGoal(m.id, 'home');
            flashGoal(m.id, 'away');
          }
        });
        prevResultsRef.current = state.matches.map((m) => ({
          home: m.result.home,
          away: m.result.away,
        }));
      }, [state.matches.map((m) => `${m.result.home}|${m.result.away}`).join(',')]);

      const matchPhaseRef = useRef(null);
      const checkMatchPhasesWeb = () => {
        // Inicializar fases en el primer tick para no notificar al cargar la página
        if (matchPhaseRef.current === null) {
          matchPhaseRef.current = {};
          state.matches.forEach((match) => {
            if (!match.kickoff) return;
            const ko = new Date(match.kickoff);
            const elapsed = (now.getTime() - ko.getTime()) / 60000;
            let phase = 'pre';
            if (elapsed >= 0 && elapsed < 47) phase = 'first_half';
            else if (elapsed >= 47 && elapsed < 63) phase = 'halftime';
            else if (elapsed >= 63 && elapsed < 112) phase = 'second_half';
            else if (elapsed >= 112) phase = 'fulltime';
            matchPhaseRef.current[match.id] = phase;
          });
          return; // No notificar en el primer tick
        }

        state.matches.forEach((match, idx) => {
          if (!match.kickoff || !match.homeTeam || !match.awayTeam) return;
          const ko = new Date(match.kickoff);
          const elapsed = (now.getTime() - ko.getTime()) / 60000;
          let phase = 'pre';
          if (elapsed >= 0 && elapsed < 47) phase = 'first_half';
          else if (elapsed >= 47 && elapsed < 63) phase = 'halftime';
          else if (elapsed >= 63 && elapsed < 112) phase = 'second_half';
          else if (elapsed >= 112) phase = 'fulltime';

          const prev = matchPhaseRef.current[match.id];
          if (prev === phase || phase === 'pre') return;
          matchPhaseRef.current[match.id] = phase;

          const label = `${match.homeTeam} vs ${match.awayTeam}`;
          const score = isResultSet(match.result) ? ` (${match.result.home}-${match.result.away})` : '';
          let title = '', body = '';
          switch (phase) {
            case 'first_half':
              title = '🟢 ¡Comienza el partido!';
              body = `${label} — Predicciones cerradas`;
              break;
            case 'halftime':
              title = '⏸️ Descanso';
              body = `${label}${score}`;
              break;
            case 'second_half':
              title = '🟢 ¡Se reanuda!';
              body = `${label}${score}`;
              break;
            case 'fulltime':
              title = '🏁 ¡Final del partido!';
              body = `${label}${score} — ${aliveCount} supervivientes`;
              break;
          }
          if (title) {
            sendBrowserNotification(title, body, `phase-${match.id}`, phase === 'fulltime');
            // También mostrar toast
            setGoalToast({ msg: title, full: body });
            setTimeout(() => setGoalToast(null), 6000);
          }
        });
      };

      // Comprobar fases cada vez que cambia "now" (cada segundo)
      useEffect(() => {
        checkMatchPhasesWeb();
      }, [now]);

      // Pedir permiso de notificaciones al cargar si hay partidos programados
      useEffect(() => {
        if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
          const hasKickoff = state.matches.some((m) => m.kickoff);
          if (hasKickoff) requestNotifPermission();
        }
      }, []);

      const getTeamLogo = (teamName) => {
        const known = KNOWN_TEAM_LOGOS[normalizeTeamName(teamName)];
        return known || logoCache[teamName] || null;
      };

      const fetchTeamLogo = async (teamName) => {
        if (!teamName || getTeamLogo(teamName)) return;
        try {
          // Search Wikipedia (English) for team logo
          const wikiRes = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(teamName + ' football club')}&srnamespace=0&format=json&origin=*&srlimit=3`);
          const wikiSearch = await wikiRes.json();
          const articles = wikiSearch?.query?.search || [];
          for (const article of articles) {
            const title = article.title;
            if (!title.toLowerCase().match(/stadium|season|temporada|estadio/)) {
              const imgRes = await fetch(`https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&format=json&pithumbsize=200&pilicense=any&origin=*`);
              const imgData = await imgRes.json();
              const pages = imgData?.query?.pages || {};
              const page = Object.values(pages)[0];
              const logo = page?.thumbnail?.source;
              if (logo) { setLogoCache((prev) => ({ ...prev, [teamName]: logo })); return; }
            }
          }
          // Fallback: search Spanish Wikipedia
          const esRes = await fetch(`https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(teamName + ' fútbol')}&srnamespace=0&format=json&origin=*&srlimit=2`);
          const esSearch = await esRes.json();
          const esArticles = esSearch?.query?.search || [];
          for (const article of esArticles) {
            const title = article.title;
            if (!title.toLowerCase().match(/estadio|temporada/)) {
              const imgRes = await fetch(`https://es.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&format=json&pithumbsize=200&pilicense=any&origin=*`);
              const imgData = await imgRes.json();
              const pages = imgData?.query?.pages || {};
              const page = Object.values(pages)[0];
              const logo = page?.thumbnail?.source;
              if (logo) { setLogoCache((prev) => ({ ...prev, [teamName]: logo })); return; }
            }
          }
        } catch {
          // silent fallback
        }
      };

      useEffect(() => {
        state.matches.forEach((m) => {
          // Si el partido ya trae logo oficial de la API, no buscar en Wikipedia
          if (m.homeTeam && !m.homeLogo) fetchTeamLogo(m.homeTeam);
          if (m.awayTeam && !m.awayLogo) fetchTeamLogo(m.awayTeam);
        });
      }, [state.matches]);

      const scrapeMatch = async (match, idx) => {
        if (!match.homeTeam || !match.awayTeam) return { ok: false, reason: 'nodata' };
        if (!sharedApiConfigured()) {
          pushLog('Scraping requiere backend configurado (Apps Script)');
          return { ok: false, reason: 'no-api' };
        }
        try {
          // Si tiene URL de Flashscore, usar esa vía; si no, TheSportsDB
          const url = match.flashscoreUrl
            ? `${API_BASE}?action=scrapeFlashscore&url=${encodeURIComponent(match.flashscoreUrl)}&appHome=${encodeURIComponent(match.homeTeam)}&appAway=${encodeURIComponent(match.awayTeam)}`
            : `${API_BASE}?action=scrapeScores&home=${encodeURIComponent(match.homeTeam)}&away=${encodeURIComponent(match.awayTeam)}`;
          const res = await fetch(url, { method: 'GET' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          if (data?.result?.found) {
            const home = Number(data.result.home);
            const away = Number(data.result.away);
            if (!Number.isFinite(home) || !Number.isFinite(away)) {
              pushLog(`Partido ${idx + 1}: marcador inválido recibido`);
              return { ok: false, reason: 'nodata' };
            }
            // La detección de goles se hace en el useEffect universal (prevResultsRef)
            setState((prevState) => {
              const matches = [...prevState.matches];
              matches[idx] = {
                ...matches[idx],
                result: { home, away },
                source: 'scraping',
                lastUpdated: new Date().toISOString(),
              };
              return { ...prevState, matches };
            });
            pushLog(`✅ ${match.flashscoreUrl ? 'Flashscore' : 'TheSportsDB'} OK: ${match.homeTeam} ${home}-${away} ${match.awayTeam}`);
            return { ok: true };
          } else {
            pushLog(`Partido ${idx + 1}: sin datos en API, usa resultado manual.`);
            return { ok: false, reason: 'nodata' };
          }
        } catch (err) {
          pushLog(`❌ Error scraping partido ${idx + 1}: ${err.message || err}`);
          return { ok: false, reason: 'network' };
        }
      };

      const runScrape = async (respectWindow = true) => {
        let attempts = 0;
        let ok = 0;
        let fail = 0;
        for (let i = 0; i < state.matches.length; i++) {
          const match = state.matches[i];
          if (!respectWindow || isLiveWindow(match.kickoff)) {
            if (!match.homeTeam || !match.awayTeam) continue;
            // El workflow del servidor (ESPN/Sofascore) tiene prioridad: si actualizó
            // hace menos de 15 min, no pisar sus datos con TheSportsDB
            if (
              (match.source === 'espn' || match.source === 'sofascore') &&
              match.lastUpdated &&
              Date.now() - new Date(match.lastUpdated).getTime() < 15 * 60 * 1000
            ) continue;
            attempts += 1;
            const result = await scrapeMatch(match, i);
            if (result?.ok) ok += 1;
            else fail += 1;
          }
        }
        if (!scrapingEnabled) {
          setScrapeStatus({ level: 'off', text: 'Actualización inactiva' });
          return;
        }

        // Auto-desactivar si todos los partidos con kickoff ya pasaron su ventana
        const allMatchesWithKickoff = state.matches.filter((m) => m.kickoff);
        if (allMatchesWithKickoff.length > 0 && allMatchesWithKickoff.every((m) => !isLiveWindow(m.kickoff))) {
          const allEnded = allMatchesWithKickoff.every((m) => new Date() > new Date(new Date(m.kickoff).getTime() + 250 * 60 * 1000));
          if (allEnded) {
            setScrapingEnabled(false);
            setScrapeStatus({ level: 'off', text: 'Scraping detenido: todos los partidos han terminado' });
            pushLog('Scraping auto-desactivado: todos los partidos fuera de ventana');
            return;
          }
        }

        if (attempts === 0) {
          setScrapeStatus({ level: 'waiting', text: 'En espera: aún no hay partidos en ventana' });
          return;
        }
        if (fail > 0) {
          setScrapeStatus({ level: 'error', text: `Error actualización (${ok} OK / ${fail} fallo)` });
          return;
        }
        setScrapeStatus({ level: 'active', text: `Actualización activa (${ok} partidos actualizados)` });
      };

      const scrapingInFlight = useRef(false);
      useEffect(() => {
        if (!scrapingEnabled) {
          setScrapeStatus({ level: 'off', text: 'Actualización inactiva' });
          return;
        }
        setScrapeStatus({ level: 'waiting', text: 'En espera: activado, pendiente de ventana de partido' });
        // Ejecutar inmediatamente al activar
        runScrape(true);
        const id = setInterval(() => {
          if (scrapingInFlight.current) return; // evitar peticiones concurrentes
          scrapingInFlight.current = true;
          runScrape(true).finally(() => { scrapingInFlight.current = false; });
        }, SCRAPE_MS);
        return () => clearInterval(id);
      }, [scrapingEnabled, state.matches.map((m) => `${m.homeTeam}|${m.awayTeam}|${m.kickoff}`).join('||')]);

      // Merge inteligente: no borra participantes existentes, solo rellena/añade
      const mergeImportedParticipants = (prev, imported) => {
        const existing = [...prev.participants];
        let added = 0;
        let updated = 0;

        for (const imp of imported) {
          const idx = existing.findIndex((p) => p.name.trim().toLowerCase() === imp.name.trim().toLowerCase());
          if (idx >= 0) {
            // Participante ya existe: solo rellenar predicciones vacías (respetar locked)
            const ex = existing[idx];
            const exLocks = ex.locked || [false, false, false];
            const mergedPreds = [0, 1, 2].map((i) => {
              // Si ya tiene predicción locked, no sobrescribir
              if (exLocks[i]) return ex.predictions[i];
              // Si ya tiene predicción válida en la web, no sobrescribir
              if (Number.isInteger(ex.predictions[i]?.home) && Number.isInteger(ex.predictions[i]?.away)) return ex.predictions[i];
              // Si el import trae predicción, usarla
              if (Number.isInteger(imp.predictions[i]?.home) && Number.isInteger(imp.predictions[i]?.away)) return imp.predictions[i];
              // Si no, mantener lo que haya
              return ex.predictions[i];
            });
            existing[idx] = { ...ex, predictions: mergedPreds };
            updated++;
          } else {
            // Participante nuevo: añadir
            existing.push({ ...imp, locked: [false, false, false] });
            added++;
          }
        }
        return { participants: existing, added, updated };
      };

      const importParticipants = async (file) => {
        if (!file) return;
        const ext = file.name.split('.').pop().toLowerCase();

        try {
          if (ext === 'json') {
            const text = await file.text();
            const arr = JSON.parse(text);
            const parsed = arr.map(normalizeParticipantRow).filter(Boolean);
            if (parsed.length) {
              adminBulkRef.current = true;
              setState((prev) => {
                const result = mergeImportedParticipants(prev, parsed);
                pushLog(`JSON: ${result.added} nuevos, ${result.updated} actualizados (sin borrar existentes)`);
                return { ...prev, participants: result.participants };
              });
            }
            return;
          }

          if ((ext === 'xlsx' || ext === 'xls') && window.XLSX) {
            const buffer = await file.arrayBuffer();
            const wb = XLSX.read(buffer, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(ws, { defval: null });
            let parsed = rows.map(normalizeParticipantRow).filter(Boolean);

            if (!parsed.length && rows.length) {
              const headers = Object.keys(rows[0]);
              const matchHeaders = headers.slice(1, 4);
              parsed = rows.map((r) => normalizeParticipantRowFromMatchColumns(r, matchHeaders)).filter(Boolean);
            }

            if (parsed.length) {
              adminBulkRef.current = true;
              setState((prev) => {
                const result = mergeImportedParticipants(prev, parsed);
                pushLog(`Excel: ${result.added} nuevos, ${result.updated} actualizados (sin borrar existentes)`);
                return { ...prev, participants: result.participants };
              });
            } else {
              pushLog('No se pudieron interpretar columnas del Excel');
            }
            return;
          }

          pushLog('Formato no soportado. Usa .json, .xlsx o .xls');
        } catch {
          pushLog('Error al importar archivo');
        }
      };

      const exportToExcel = () => {
        const rows = state.participants.map((p) => {
          const ev = evaluateParticipant(p, state.matches);
          const row = { nombre: p.name };
          state.matches.forEach((m, i) => {
            const pr = p.predictions?.[i];
            row[`p${i + 1}_local`] = pr?.home ?? '';
            row[`p${i + 1}_visitante`] = pr?.away ?? '';
            row[`p${i + 1}_resultado`] = (pr?.home != null && pr?.away != null) ? `${pr.home}-${pr.away}` : '';
          });
          row['estado'] = ev.status === 'alive' ? 'VIVO' : `ELIMINADO P${ev.eliminatedAt}`;
          state.matches.forEach((m, i) => {
            const mr = m.result;
            row[`resultado_real_p${i + 1}`] = (mr?.home != null && mr?.away != null) ? `${mr.home}-${mr.away}` : '';
          });
          return row;
        });
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Participantes');
        XLSX.writeFile(wb, `porra_export_${new Date().toISOString().slice(0, 10)}.xlsx`);
        pushLog('Exportación Excel generada');
      };

      const scrollToTop = () => {
        try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch { window.scrollTo(0, 0); }
      };

      const resetRound = () => {
        if (!confirm('Se borrarán resultados de partidos Y pronósticos de todos los participantes. ¿Continuar?')) return;
        adminBulkRef.current = true;
        scrollToTop();
        setState((prev) => ({
          ...prev,
          matches: prev.matches.map((m) => ({ ...m, result: { home: null, away: null }, source: 'manual', lastUpdated: null })),
          participants: prev.participants.map((p) => ({
            ...p,
            predictions: [
              { home: null, away: null },
              { home: null, away: null },
              { home: null, away: null },
            ],
            locked: [false, false, false],
          })),
        }));
        prevResultsRef.current = null; // Se reinicializará en el próximo render
        pushLog('Jornada reseteada (resultados y pronósticos)');
      };

      const resetParticipantPredictions = (participantId) => {
        const participant = state.participants.find((p) => p.id === participantId);
        if (!participant) return;
        if (!confirm(`Se borrarán los 3 pronósticos de ${participant.name}. ¿Continuar?`)) return;
        adminTouchedRef.current.add(participantId);
        scrollToTop();
        setState((prev) => ({
          ...prev,
          participants: prev.participants.map((p) =>
            p.id === participantId
              ? {
                ...p,
                predictions: [
                  { home: null, away: null },
                  { home: null, away: null },
                  { home: null, away: null },

                locked: [false, false, false],

              : p

        }));
        pushLog(`Reseteado participante: ${participant.name}`);
      };

      return (
        <div className="space-y-5 md:space-y-6 pb-20 md:pb-6">
          <header className="glass rounded-3xl p-5 md:p-8 shadow-neon relative overflow-hidden card-in">
            {/* Haz de luz decorativo */}
            <div aria-hidden="true" className="absolute -top-24 left-1/2 -translate-x-1/2 w-[560px] h-56 rounded-full bg-lime-300/10 blur-3xl pointer-events-none" />
            <div className="relative flex flex-col md:flex-row md:items-center md:justify-between gap-5">
              <div>
                <p className="font-display uppercase tracking-[0.35em] text-[11px] md:text-xs text-cyan-300/90 mb-1.5">Muerte súbita · 3 partidos · Sin segundas oportunidades</p>
                <h1 className="wordmark text-3xl md:text-5xl leading-none uppercase">La Porra<br className="md:hidden" /> de Supervivencia</h1>

                <span
                  className={`inline-block w-2.5 h-2.5 rounded-full ${storageMode === 'shared'
                      ? 'bg-lime-400 shadow-[0_0_10px_rgba(163,230,53,0.95)]'
                      : 'bg-amber-400 shadow-[0_0_10px_rgba(251,191,36,0.95)]'
                    }`}
                />
                <span className="text-slate-300">{storageMode === 'shared' ? 'Datos compartidos: ON' : 'Datos compartidos: OFF'}</span>
              </div>
            </div>
          </header>

          <section className="grid grid-cols-1 lg:grid-cols-3 gap-4">
            {state.matches.map((match, idx) => {
              const homeLogo = match.homeLogo || getTeamLogo(match.homeTeam);
              const awayLogo = match.awayLogo || getTeamLogo(match.awayTeam);
              const homeFlash = flashMap[`${match.id}-home`];
              const awayFlash = flashMap[`${match.id}-away`];
              const phase = getMatchPhase(match);
              const phaseDot =
                phase.level === 'active'
                  ? 'bg-lime-400 shadow-[0_0_10px_rgba(74,222,128,0.95)]'
                  : phase.level === 'waiting'
                    ? 'bg-amber-400 shadow-[0_0_10px_rgba(251,191,36,0.95)]'
                    : 'bg-rose-500 shadow-[0_0_10px_rgba(244,63,94,0.95)]';

              return (
                <article
                  key={match.id}
                  style={{ animationDelay: `${idx * 90}ms` }}
                  className={`glass rounded-3xl overflow-hidden card-in relative ${phase.level === 'active' ? 'shadow-neon' : ''}`}
                >
                  {/* Resplandor superior según fase */}
                  <div
                    aria-hidden="true"
                    className={`absolute inset-x-0 top-0 h-24 pointer-events-none bg-gradient-to-b ${
                      phase.level === 'active'
                        ? 'from-lime-400/15 to-transparent'
                        : phase.level === 'ended'
                          ? 'from-slate-400/10 to-transparent'
                          : 'from-cyan-400/10 to-transparent'
                    }`}
                  />

                  {/* Cabecera: número de partido y fase */}
                  <div className={`relative px-4 py-2.5 flex items-center justify-between border-b ${
                    phase.level === 'active'
                      ? 'border-lime-400/25 bg-lime-400/5'
                      : phase.level === 'ended'
                        ? 'border-white/10 bg-black/25'
                        : 'border-white/10 bg-black/15'
                  }`}>
                    <span className="font-display text-xs font-semibold uppercase tracking-[0.28em] text-slate-400">Partido {idx + 1}</span>
                    <div className={`inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 ${
                      phase.level === 'active' ? 'bg-lime-400/10 border border-lime-400/30' : 'bg-transparent'
                    }`}>
                      <span className={`inline-block w-2 h-2 rounded-full ${phaseDot} ${phase.level === 'active' ? 'live-dot' : ''}`} />
                      <span className={`text-[11px] font-display font-semibold uppercase tracking-wider ${phase.level === 'active' ? 'text-lime-300' : phase.level === 'ended' ? 'text-rose-300' : 'text-amber-300'}`}>{phase.text}</span>
                    </div>
                  </div>

                  {/* Marcador principal: escudo - marcador - escudo */}
                  <div className="relative px-4 pt-4 pb-3">
                    {/* Fecha/hora */}
                    {match.kickoff && (
                      <p className="text-center text-[11px] text-slate-500 mb-3 font-display tracking-[0.18em] uppercase">
                        {new Date(match.kickoff).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' })}
                        {' · '}{new Date(match.kickoff).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}
                      </p>
                    )}

                    <div className="flex items-center justify-between gap-2">
                      {/* Equipo local */}
                      <div className="flex flex-col items-center gap-2 flex-1">
                        <div className="w-[72px] h-[72px] rounded-2xl bg-gradient-to-b from-white/10 to-white/[0.03] border border-white/10 p-2 flex items-center justify-center shadow-[0_10px_24px_-12px_rgba(0,0,0,0.8)]">
                          {homeLogo
                            ? <img src={homeLogo} alt={match.homeTeam} className={`w-full h-full object-contain drop-shadow-[0_4px_10px_rgba(0,0,0,0.6)] ${homeFlash ? 'animate-goal' : ''}`} />
                            : <span className="font-display text-3xl font-bold text-slate-500">{(match.homeTeam||'?')[0]}</span>
                          }
                        </div>
                        <span className="text-xs font-semibold text-slate-200 text-center leading-tight max-w-[84px] team-name">{match.homeTeam || 'Local'}</span>
                      </div>

                      {/* Bloque de marcador */}
                      <div className="flex flex-col items-center gap-1 min-w-[112px]">
                        <div className="flex items-baseline gap-1.5">
                          <span className={`score-num text-6xl ${
                            phase.level === 'active'
                              ? (homeFlash ? 'text-lime-300 animate-goal' : 'text-white')
                              : phase.level === 'ended'
                                ? 'text-lime-200'
                                : 'text-slate-600'
                          }`}>
                            {phase.level === 'waiting'
                              ? '–'
                              : (match.result.home !== null && match.result.home !== undefined ? match.result.home : 0)
                            }
                          </span>
                          <span className={`score-num text-3xl ${phase.level === 'waiting' ? 'text-slate-700' : 'text-slate-500'}`}>–</span>
                          <span className={`score-num text-6xl ${
                            phase.level === 'active'
                              ? (awayFlash ? 'text-lime-300 animate-goal' : 'text-white')
                              : phase.level === 'ended'
                                ? 'text-lime-200'
                                : 'text-slate-600'
                          }`}>
                            {phase.level === 'waiting'
                              ? '–'
                              : (match.result.away !== null && match.result.away !== undefined ? match.result.away : 0)
                            }
                          </span>
                        </div>
                        {phase.level === 'active' && (
                          <span className="mt-0.5 inline-flex items-center gap-1.5 rounded-full bg-lime-400/15 border border-lime-400/40 px-2.5 py-1 text-[11px] text-lime-300 uppercase font-display font-semibold tracking-[0.14em] animate-pulse">
                            {match.live && /halftime|descanso/i.test(match.live.status || '')
                              ? 'DESCANSO'
                              : match.live && match.live.minute
                                ? `EN VIVO · ${match.live.minute}′`
                                : 'EN VIVO'}
                          </span>
                        )}
                        {phase.level === 'ended' && isResultSet(match.result) && (
                          <span className="text-[11px] text-slate-400 uppercase font-display font-semibold tracking-[0.22em]">Final</span>
                        )}
                        {phase.level === 'waiting' && (
                          <span className="text-[11px] text-amber-300/80 uppercase font-display font-semibold tracking-[0.22em]">Pendiente</span>
                        )}
                      </div>

                      {/* Equipo visitante */}
                      <div className="flex flex-col items-center gap-2 flex-1">
                        <div className="w-[72px] h-[72px] rounded-2xl bg-gradient-to-b from-white/10 to-white/[0.03] border border-white/10 p-2 flex items-center justify-center shadow-[0_10px_24px_-12px_rgba(0,0,0,0.8)]">
                          {awayLogo
                            ? <img src={awayLogo} alt={match.awayTeam} className={`w-full h-full object-contain drop-shadow-[0_4px_10px_rgba(0,0,0,0.6)] ${awayFlash ? 'animate-goal' : ''}`} />
                            : <span className="font-display text-3xl font-bold text-slate-500">{(match.awayTeam||'?')[0]}</span>
                          }
                        </div>
                        <span className="text-xs font-semibold text-slate-200 text-center leading-tight max-w-[84px] team-name">{match.awayTeam || 'Visitante'}</span>
                      </div>
                    </div>

                    {/* Goles y tarjetas: timeline a dos columnas */}
                    {Array.isArray(match.events) && match.events.length > 0 && (
                      <div className="mt-4 rounded-xl bg-black/25 border border-white/[0.07] px-3 py-2.5 grid grid-cols-2 gap-x-3 text-[11px]">
                        <div className="space-y-1 border-r border-white/[0.07] pr-2">
                          {match.events.filter((e) => e.side === 'home').map((e, i) => (
                            <p key={`h${i}`} className={`flex items-baseline gap-1.5 ${e.type === 'goal' ? 'text-slate-100 font-medium' : 'text-slate-400'}`}>
                              <span>{e.type === 'goal' ? '⚽' : e.type === 'red' ? '🟥' : '🟨'}</span>
                              {e.minute ? <span className="font-display text-lime-300/90 shrink-0">{e.minute}′</span> : null}

                            </p>
                          ))}
                        </div>
                        <div className="space-y-1 text-right pl-2">
                          {match.events.filter((e) => e.side === 'away').map((e, i) => (
                            <p key={`a${i}`} className={`flex items-baseline justify-end gap-1.5 ${e.type === 'goal' ? 'text-slate-100 font-medium' : 'text-slate-400'}`}>
                              <span className="truncate">{e.player}</span>
                              {e.minute ? <span className="font-display text-lime-300/90 shrink-0">{e.minute}′</span> : null}
                              <span>{e.type === 'goal' ? '⚽' : e.type === 'red' ? '🟥' : '🟨'}</span>
                            </p>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Countdown */}
                    {(() => {
                      const cd = getCountdown(match);
                      if (!cd) return null;
                      return (
                        <div className="mt-4 rounded-xl bg-amber-400/[0.08] border border-amber-400/30 px-3 py-2.5 text-center">
                          <p className="text-[10px] font-display uppercase tracking-[0.28em] text-amber-300/80">Predicciones cierran en</p>
                          <p className="score-num text-2xl text-amber-200 mt-0.5">{cd}</p>
                        </div>
                      );
                    })()}
                  </div>
                </article>
              );
            })}
          </section>

          <section className="glass rounded-3xl p-4 md:p-6 card-in" style={{ animationDelay: '260ms' }}>
            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div>
                <h2 className="font-display text-lg md:text-xl font-semibold uppercase tracking-[0.14em] text-cyan-300">Pronósticos participantes</h2>
                <p className="text-sm text-slate-400 mt-1">Usa el botón de tu tarjeta para poner tu apuesta antes de que empiece el partido.</p>
              </div>
              {!state.matches.every((m) => isMatchLocked(m)) && (
                <button
                  onClick={openEntryModal}
                  className="tap-btn bg-lime-400 hover:bg-lime-300 text-slate-950 rounded-xl px-6 py-3 text-sm font-extrabold whitespace-nowrap shadow-[0_8px_24px_-8px_rgba(163,230,53,0.7)]"
                >
                  ＋ Nueva apuesta
                </button>
              )}
            </div>
            <p className="text-xs text-slate-400 mt-3">{submitMsg || '\u00a0'}</p>
          </section>

          {entryOpen && (
            <section className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md p-2 md:p-4 grid place-items-center">
              <div className="mobile-modal w-full max-w-2xl glass rounded-3xl p-4 md:p-6 space-y-4 border border-lime-400/25 shadow-neon">

                  <input

              const sorted = [...evaluatedParticipants].sort((a, b) => {
                // Vivos primero, luego eliminados
                if (a.status === 'alive' && b.status !== 'alive') return -1;
                if (a.status !== 'alive' && b.status === 'alive') return 1;
                // Entre eliminados: eliminado más tarde = mejor posición (arriba)
                if (a.status === 'eliminated' && b.status === 'eliminated') {
                  if ((b.eliminatedAt || 0) !== (a.eliminatedAt || 0)) return (b.eliminatedAt || 0) - (a.eliminatedAt || 0);
                }
                // Entre vivos: con pronóstico completo primero
                if (a.status === 'alive' && b.status === 'alive') {
                  const aFull = a.predictions.every((pr) => Number.isInteger(pr.home) && Number.isInteger(pr.away));
                  const bFull = b.predictions.every((pr) => Number.isInteger(pr.home) && Number.isInteger(pr.away));
                  if (aFull && !bFull) return -1;
                  if (!aFull && bFull) return 1;
                }
                // Mismo grupo: ordenación natural (Diamante 2 antes que Diamante 11)
                return a.name.localeCompare(b.name, 'es', { numeric: true, sensitivity: 'base' });
              });
              const aliveList = sorted.filter((p) => p.status === 'alive');
              const outList = sorted.filter((p) => p.status !== 'alive');
              const totalCount = evaluatedParticipants.length;
              const alivePct = totalCount ? Math.round((aliveList.length / totalCount) * 100) : 0;

              const renderCard = (p) => {
                const hasFullPrediction = p.predictions.every((pr) => Number.isInteger(pr.home) && Number.isInteger(pr.away));
                const lightClass = p.status === 'eliminated'
                  ? 'bg-rose-500 shadow-[0_0_12px_rgba(244,63,94,0.95)]'
                  : hasFullPrediction
                    ? 'bg-lime-400 shadow-[0_0_12px_rgba(163,230,53,0.95)] animate-pulse'
                    : 'bg-amber-400 shadow-[0_0_12px_rgba(251,191,36,0.95)] animate-pulse';
                const lightTitle = p.status === 'eliminated' ? 'Eliminado' : hasFullPrediction ? 'Pronóstico completo' : 'Pronóstico incompleto';
                const cardClass = p.status === 'eliminated'
                  ? 'border-white/10 eliminated'
                  : hasFullPrediction
                    ? 'border-lime-400/40 animate-alive'
                    : 'border-amber-400/60';
                const editionClosed = state.matches.every((m) => isMatchLocked(m));
                const allSent = p.locked && p.locked.every(Boolean);
                const canBet = !editionClosed && !allSent;
                return (
                  <article
                    key={p.id}
                    className={`rounded-2xl border px-3 py-2.5 relative bg-black/30 ${cardClass}`}
                  >
                    {/* Linea 1: punto de estado + nombre completo + etiqueta */}

                        className={`shrink-0 inline-block w-2.5 h-2.5 rounded-full ${lightClass}`}
                        title={lightTitle}
